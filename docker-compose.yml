version: '3.8'

services:
  # FastAPI application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aigram_backend
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./data:/app/data

  # React static dashboard served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aigram_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
